name: Build Shadow Fight 2 macOS app

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner with Xcode preinstalled

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show Swift/Xcode version (useful for debugging)
        run: |
          swift --version
          xcodebuild -version

      - name: Build universal app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip the .app (artifacts can't upload a bundle directly)
        run: ditto -c -k --sequesterRsrc --keepParent "Shadow Fight 2.app" "ShadowFight2-macOS-universal.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFight2-macOS-universal
          path: ShadowFight2-macOS-universal.zip
          if-no-files-found: error
